name: Validate offline notebook
on:
  push:
    paths:
      - 'offline-test/index.html'
      - 'offline-test/sw.js'
      - '.github/workflows/validate-offline.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and UI controls
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('offline-test/index.html','utf8');
          const inline=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]).filter(Boolean);
          if(inline.length<1)throw Error('Missing app script');
          for(const js of inline)new vm.Script(js);
          for(const id of ['addInvoice','invoicePanel','product','warrantyMonths','date','end','merchant','country','serial','scan','scanQR','extractReceipt','chooseReceipt','receipt','extraReceipts','records','archive','export','import'])if(!html.includes('id="'+id+'"'))throw Error('Missing '+id);
          const parser=html.slice(html.indexOf('function parseReceiptText(raw){'),html.indexOf('async function extractSelectedReceipt()'));
          const parse=new Function(parser+';return parseReceiptText')();
          const sample=['ولاية السيب، سوق الحيل الشمالية، محافظة مسقط، سلطنة عمان','هاتف المحل: +968 24123456 | الواتساب: +968 91234567','فاتورة ضمان معتمدة','رقم الفاتورة: INV-2026-1017','تاريخ الإصدار: 17/10/2026','وصف المنتج الكمية السعر الإجمالي','هاتف سامسونج جالاكسي 1 560.000','(Samsung Galaxy Ultra)','المجموع الكلي: 560.000 ريال عماني','مدة الضمان: يسري هذا الضمان لمدة 3 سنوات ميلادية','SN-SAM-2026-GALAX-560OMR-3Y'].join(String.fromCharCode(10));
          const parsed=parse(sample);
          if(!parsed.product.includes('سامسونج')||parsed.months!==36||parsed.serial!=='SN-SAM-2026-GALAX-560OMR-3Y'||parsed.governorate!=='مسقط'||parsed.wilayat!=='السيب'||parsed.merchant.includes('هاتف المحل'))throw Error('Arabic OCR parsing regression: '+JSON.stringify(parsed));
          console.log('PASS: Arabic receipt fields from mixed RTL OCR sample');
          const sw=fs.readFileSync('offline-test/sw.js','utf8');new vm.Script(sw);
          console.log('PASS: JavaScript syntax, UI IDs, service worker syntax');
          NODE
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory offline-test >/tmp/dhamani-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded'});
            await page.locator('#addInvoice').click();
            if(!await page.locator('#invoicePanel').isVisible())throw Error('Add invoice panel not shown');
            await page.locator('#warrantyMonths').fill('12');
            await page.locator('#date').fill('2026-10-01');
            await page.locator('#date').dispatchEvent('change');
            if(await page.locator('#end').inputValue()!=='2027-10-01')throw Error('Expiry calculation failed');
            await page.locator('#product').fill('اختبار');
            await page.locator('#merchant').fill('متجر اختبار');
            await page.locator('#form button[type=submit]').click();
            await page.waitForTimeout(600);
            if(!await page.locator('#records').getByText('اختبار').count())throw Error('Invoice not saved');
            await page.locator('#records button[data-action=edit]').first().click();
            await page.waitForTimeout(400);
            if(!await page.locator('#invoicePanel').isVisible())throw Error('Edit invoice panel not shown; status='+await page.locator('#status').innerText()+'; errors='+errors.join(' | '));
            // Verify edited record persists after save and reload.
            await page.locator('#product').fill('منتج معدل');
            await page.locator('#form button[type=submit]').click();
            await page.waitForTimeout(250);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('#records').getByText('منتج معدل').waitFor();
            const original=await page.evaluate(async()=>new Promise((resolve,reject)=>{
              const r=indexedDB.open('dhamani-offline-v1',1);
              r.onsuccess=()=>{const t=r.result.transaction('receipts','readonly'),q=t.objectStore('receipts').getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)};
              r.onerror=()=>reject(r.error)
            }));
            if(original.length!==1||original[0].product!=='منتج معدل')throw Error('Edited record not persisted');
            // Verify attached image survives export and atomic import.
            const pixel='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9mS7sAAAAASUVORK5CYII=';
            const fixture={format:'dhamani-offline-v1',records:[{...original[0],id:'imported-test',product:'نسخة مستعادة',receipt:{name:'invoice.png',type:'image/png',data:pixel},attachments:[{name:'extra.png',type:'image/png',data:pixel}]}]};
            page.once('dialog',d=>d.accept());
            await page.locator('#import').setInputFiles({name:'backup.json',mimeType:'application/json',buffer:Buffer.from(JSON.stringify(fixture))});
            await page.waitForTimeout(400);
            const restored=await page.evaluate(async()=>new Promise((resolve,reject)=>{
              const r=indexedDB.open('dhamani-offline-v1',1);
              r.onsuccess=()=>{const t=r.result.transaction('receipts','readonly'),q=t.objectStore('receipts').get('imported-test');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)};
              r.onerror=()=>reject(r.error)
            }));
            if(!restored||restored.receipt?.data!==pixel||restored.attachments?.[0]?.data!==pixel)throw Error('Backup restore lost receipt images');
            // Test offline reload after service worker activation and preservation of data.
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'load'});
            await page.evaluate(async()=>{
              if(!('serviceWorker' in navigator))throw Error('Service workers unavailable');
              await navigator.serviceWorker.ready;
              if(!navigator.serviceWorker.controller)await new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}));
            });
            await page.reload({waitUntil:'load'});
            await page.context().setOffline(true);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('#records').getByText('نسخة مستعادة').waitFor();
            await page.context().setOffline(false);
            if(errors.length)throw Error('Browser errors: '+errors.join('; '));
            await browser.close();console.log('PASS: create, expiry, save, edit');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
