name: PostgreSQL license integration
on:
  push:
    paths:
      - 'licensing-prototype/**'
      - '.github/workflows/postgres-license-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dhamani_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: dhamani_licenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhamani_test -d dhamani_licenses_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DHAMANI_TEST_DATABASE_URL: postgres://dhamani_test:local_ci_only@localhost:5432/dhamani_licenses_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary PostgreSQL test driver
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8
      - name: Initialize isolated PostgreSQL test schema before concurrent test files
        run: |
          psql "$DHAMANI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f licensing-prototype/postgres/001_schema.sql
          psql "$DHAMANI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f licensing-prototype/postgres/003_owner_auth_proposal.sql
      - name: Run real PostgreSQL transaction tests
        run: node --test licensing-prototype/postgres-integration.test.mjs licensing-prototype/postgres-owner-challenge-integration.test.mjs licensing-prototype/postgres-owner-totp-replay-integration.test.mjs licensing-prototype/postgres-owner-mfa-acceptance-integration.test.mjs licensing-prototype/postgres-owner-mfa-session-integration.test.mjs licensing-prototype/postgres-owner-session-integration.test.mjs licensing-prototype/postgres-owner-csrf-integration.test.mjs
