name: Bundle offline barcode reader
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bundle-barcode.yml'
      - 'offline-test/barcode-entry.js'
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build self-hosted ZXing reader
        run: |
          npm install --no-save @zxing/browser@0.1.5 esbuild@0.25.12
          npx esbuild offline-test/barcode-entry.js --bundle --minify --format=iife --global-name=ZXingOffline --outfile=offline-test/zxing.min.js
      - name: Commit bundled offline reader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-test/zxing.min.js
          git diff --cached --quiet || (git commit -m "build: bundle offline barcode reader" && git push)
