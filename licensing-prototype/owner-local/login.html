<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ضماني | دخول المالك التجريبي</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;background:#edf3f9;color:#15304b;min-height:100vh;display:grid;place-items:center}main{background:white;padding:26px;border-radius:16px;width:min(430px,92vw);box-shadow:0 10px 32px #12345618}h1{margin:0 0 8px}p{line-height:1.7}.warning{background:#fff5df;padding:12px;border-right:4px solid #b77b1a}label{display:block;font-weight:600;margin:18px 0 7px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #9bafc1;border-radius:8px;font:inherit}button{margin-top:18px;background:#143654;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer;width:100%;font:inherit}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #e8b044}#status{min-height:2em}a{color:#143654}section[hidden]{display:none}</style></head><body><main><h1>دخول مالك ضماني</h1><p class="warning">اختبار محلي فقط. لا تدخل بيانات حسابات أو عملاء حقيقية.</p><form id="passwordForm"><label for="password">كلمة المرور التجريبية</label><input id="password" type="password" autocomplete="off" minlength="12" required><button type="submit">الانتقال إلى رمز التحقق</button></form><form id="totpForm" hidden><label for="totp">رمز المصادقة الثنائية (6 أرقام)</label><input id="totp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">تسجيل الدخول</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/owner/dashboard">لوحة الإدارة (تتطلب تسجيل الدخول)</a></p></main><script src="/owner/login.js" defer></script></body></html>
